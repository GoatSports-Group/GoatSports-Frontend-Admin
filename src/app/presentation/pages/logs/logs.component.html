<div class="flex flex-col gap-6 animate-fade-in relative z-10 h-full min-h-0">

  <!-- Page Header -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-2">
    <div class="flex flex-col">
      <h1 class="m-0 text-ink font-extrabold tracking-[-0.035em] leading-[1.15] text-[clamp(28px,3vw,40px)]">Nhật ký hoạt động</h1>
      <p class="mt-1.5 max-w-[68ch] text-base text-slate-500 leading-relaxed">
        Giám sát và kiểm vết các yêu cầu HTTP API, trạng thái xử lý và thời gian phản hồi hệ thống
      </p>
    </div>
  </div>

  <!-- Section 1-5: Overview & Statistics Dashboard -->
  <app-overview-stats [stats]="stats" [loading]="loadingStats"></app-overview-stats>

  <!-- Filters Section -->
  <app-log-filter [(filterDescription)]="filterDescription" [(filterAction)]="filterAction"
    [actions]="uniqueActions"
    [(filterFromDate)]="filterFromDate" [(filterToDate)]="filterToDate" (search)="onSearch()" (reset)="resetFilters()">
  </app-log-filter>

  <!-- Log Table & Details Overlay -->
  <app-log-table [logs]="logs" [loading]="loading" [pageIndex]="pageIndex" [pageSize]="pageSize"
    [totalItems]="totalItems" (prevPage)="onPrevPage()" (nextPage)="onNextPage()" (goToPage)="goToPage($event)">
  </app-log-table>

</div>
