<div class="flex flex-col gap-6 animate-fade-in relative z-10 pl-4 h-full min-h-0 pb-10">

  <!-- Page Header -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-2">
    <div class="flex flex-col">
      <h1 class="font-display text-2xl font-black text-slate-900 tracking-tight">Nhật ký hoạt động</h1>
      <p class="text-sm font-semibold text-slate-500 mt-1">
        Giám sát và kiểm vết các yêu cầu HTTP API, trạng thái xử lý và thời gian phản hồi hệ thống
      </p>
    </div>
  </div>

  <!-- Section 1-5: Overview & Statistics Dashboard -->
  <app-overview-stats [stats]="stats" [loading]="loadingStats"></app-overview-stats>

  <!-- Filters Section -->
  <app-log-filter 
    [(filterPath)]="filterPath"
    [(filterMethod)]="filterMethod"
    [(filterStatusClass)]="filterStatusClass"
    [(filterFromDate)]="filterFromDate"
    [(filterToDate)]="filterToDate"
    (search)="onSearch()"
    (reset)="resetFilters()">
  </app-log-filter>

  <!-- Log Table & Details Overlay -->
  <app-log-table
    [logs]="logs"
    [loading]="loading"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [totalItems]="totalItems"
    (prevPage)="onPrevPage()"
    (nextPage)="onNextPage()"
    (goToPage)="goToPage($event)">
  </app-log-table>

</div>
