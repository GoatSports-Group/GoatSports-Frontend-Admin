<div class="preview-dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ data.title }}</h2>
    <button mat-icon-button class="close-btn" (click)="close()" aria-label="Close dialog">
      <lucide-icon name="x" class="h-5 w-5"></lucide-icon>
    </button>
  </div>

  <div class="dialog-body">
    @if (loading) {
      <div class="loading-box">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Đang tải tài liệu...</p>
      </div>
    } @else if (error) {
      <div class="error-box">
        <lucide-icon name="alert-circle" class="text-rose-500 h-10 w-10 mb-2 mx-auto block"></lucide-icon>
        <p>Không thể xem trước tài liệu này trực tiếp.</p>
      </div>
    } @else {
      @if (isImageFile) {
        <div class="image-viewer">
          <img [src]="resolvedUrl" alt="Tài liệu" class="preview-img">
        </div>
      } @else {
        <div class="pdf-viewer">
          <iframe [src]="resolvedUrl" class="preview-iframe" width="100%" height="550px"></iframe>
        </div>
      }
    }
  </div>

  <div class="dialog-actions">
    @if (downloadUrl) {
      <a mat-flat-button color="primary" [href]="downloadUrl" target="_blank" class="view-btn flex items-center gap-1.5 justify-center">
        <lucide-icon name="external-link" class="h-4 w-4 shrink-0"></lucide-icon> Mở tab mới / Tải xuống
      </a>
    }
    <button mat-button (click)="close()" class="cancel-btn">Đóng</button>
  </div>
</div>
