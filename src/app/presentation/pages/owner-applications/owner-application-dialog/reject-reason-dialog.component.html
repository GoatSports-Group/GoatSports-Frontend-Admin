<div class="p-6 bg-white text-slate-900 rounded-[28px] border border-slate-100 flex flex-col w-full max-w-md shadow-2xl select-none animate-fade-in">
  <!-- Dialog Header -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="font-sports-display text-lg font-black uppercase tracking-tight text-rose-600 m-0 flex items-center gap-1.5">
      <lucide-icon name="alert-triangle" class="text-rose-600 h-5 w-5 shrink-0"></lucide-icon> Từ Chối Đơn Đăng Ký
    </h2>
    <button type="button" (click)="onCancel()"
      class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 transition-all cursor-pointer flex items-center justify-center">
      <lucide-icon name="x" class="h-5 w-5"></lucide-icon>
    </button>
  </div>

  <div class="flex flex-col gap-4">
    <p class="text-xs text-slate-500 font-semibold leading-relaxed m-0">Vui lòng nhập lý do từ chối đơn đăng ký kinh doanh này. Lý do sẽ được gửi tới email của người đăng ký.</p>
    
    <!-- Textarea Form field -->
    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-extrabold uppercase tracking-wide text-slate-700">Lý do từ chối</label>
      <textarea [(ngModel)]="rejectReason" required rows="4" placeholder="Ví dụ: Tài liệu đính kèm bị mờ, mã số thuế không hợp lệ..."
        class="w-full p-4 bg-slate-50/70 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-800 focus:outline-none focus:bg-white focus:ring-4 focus:ring-rose-500/5 focus:border-rose-500 hover:border-slate-400 transition-all"></textarea>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 mt-6 border-t border-slate-100 pt-4">
      <button type="button" (click)="onCancel()"
        class="px-5 py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200/60 rounded-full font-bold text-xs transition-all active:scale-[0.98] cursor-pointer">
        Hủy Bỏ
      </button>
      <button type="button" [disabled]="!rejectReason.trim()" (click)="onSubmit()"
        class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-full font-bold text-xs shadow-md shadow-rose-600/10 transition-all active:scale-[0.98] cursor-pointer disabled:opacity-50">
        Xác Nhận Từ Chối
      </button>
    </div>
  </div>
</div>
