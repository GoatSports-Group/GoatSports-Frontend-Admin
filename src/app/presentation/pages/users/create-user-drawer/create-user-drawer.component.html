<div
  class="w-[440px] max-w-[100vw] h-screen bg-white shadow-2xl flex flex-col justify-between overflow-hidden transform transition-transform duration-300 ease-out"
  [class.translate-x-0]="isCreateDrawerOpen" [class.translate-x-full]="!isCreateDrawerOpen">

  <!-- Drawer Header -->
  <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-white">
    <h2 class="text-lg font-bold text-slate-900 font-display">Tạo tài khoản</h2>
    <button type="button" (click)="close.emit()"
      class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 transition-colors cursor-pointer">
      <lucide-icon name="x" class="h-5 w-5"></lucide-icon>
    </button>
  </div>

  <!-- Drawer Body Content -->
  <div class="flex-1 overflow-y-auto p-6 space-y-5">
    <!-- Username -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-bold text-emerald-600">Username <span class="text-rose-500">*</span></label>
      <input type="text" [(ngModel)]="newUser.username" placeholder="Nhập username (tên đăng nhập)"
        class="w-full h-11 px-4 bg-slate-50/70 border border-slate-100 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-slate-100/80 transition-all">
    </div>

    <!-- Full Name -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-bold text-emerald-600">Họ và tên <span class="text-rose-500">*</span></label>
      <input type="text" [(ngModel)]="newUser.fullName" placeholder="Nhập họ và tên đầy đủ"
        class="w-full h-11 px-4 bg-slate-50/70 border border-slate-100 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-slate-100/80 transition-all">
    </div>

    <!-- Email -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-bold text-emerald-600">Email <span class="text-rose-500">*</span></label>
      <input type="email" [(ngModel)]="newUser.email" placeholder="Nhập địa chỉ email"
        class="w-full h-11 px-4 bg-slate-50/70 border border-slate-100 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-slate-100/80 transition-all">
    </div>

    <!-- Gender -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-bold text-emerald-600">Giới tính <span class="text-rose-500">*</span></label>
      <div class="grid grid-cols-3 gap-2.5 pt-0.5">
        <button type="button" (click)="newUser.gender = 'MALE'"
          [class]="newUser.gender === 'MALE' ? 'h-11 rounded-xl bg-primary text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-xs transition-all cursor-pointer' : 'h-11 rounded-xl bg-slate-50/70 border border-slate-100 text-slate-700 font-semibold text-xs flex items-center justify-center gap-1.5 hover:bg-slate-100 transition-all cursor-pointer'">
          Nam
        </button>
        <button type="button" (click)="newUser.gender = 'FEMALE'"
          [class]="newUser.gender === 'FEMALE' ? 'h-11 rounded-xl bg-primary text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-xs transition-all cursor-pointer' : 'h-11 rounded-xl bg-slate-50/70 border border-slate-100 text-slate-700 font-semibold text-xs flex items-center justify-center gap-1.5 hover:bg-slate-100 transition-all cursor-pointer'">
          Nữ
        </button>
        <button type="button" (click)="newUser.gender = 'OTHER'"
          [class]="newUser.gender === 'OTHER' ? 'h-11 rounded-xl bg-primary text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-xs transition-all cursor-pointer' : 'h-11 rounded-xl bg-slate-50/70 border border-slate-100 text-slate-700 font-semibold text-xs flex items-center justify-center gap-1.5 hover:bg-slate-100 transition-all cursor-pointer'">
          Khác
        </button>
      </div>
    </div>

    <!-- Password -->
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-bold text-emerald-600">Mật khẩu <span class="text-rose-500">*</span></label>
      <div class="relative">
        <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="newUser.password"
          placeholder="Nhập mật khẩu"
          class="w-full h-11 pl-4 pr-10 bg-slate-50/70 border border-slate-100 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-slate-100/80 transition-all">
        <button type="button" (click)="toggleShowPassword()"
          class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
          <lucide-icon [name]="showPassword ? 'eye-off' : 'eye'" class="h-4 w-4"></lucide-icon>
        </button>
      </div>

      <!-- Password Requirement Hint -->
      <p class="text-[13px] font-semibold mt-1 flex items-start gap-1 leading-normal">
        <lucide-icon name="info" class="h-4 w-4 text-emerald-400 shrink-0 mt-0.5"></lucide-icon>
        <span>Mật khẩu phải có ít nhất 8 ký tự, chữ hoa, chữ thường, số và ký tự đặc biệt</span>
      </p>

      <!-- Password Strength Meter -->
      @if (newUser.password) {
        <div class="space-y-1.5 mt-1.5 animate-fade-in">
          <div class="flex justify-between items-center text-xs">
            <span class="text-slate-500 font-bold uppercase tracking-wider text-[10px]">Độ mạnh mật khẩu</span>
            <span class="font-extrabold uppercase tracking-wider text-[10px]" [class]="getPasswordStrength() === 1 ? 'text-rose-600 font-black' :
                       getPasswordStrength() === 2 ? 'text-amber-600 font-black' :
                       getPasswordStrength() === 3 ? 'text-yellow-600 font-black' :
                       'text-emerald-600 font-black'">
              {{ getPasswordStrength() === 1 ? 'Yếu' :
              getPasswordStrength() === 2 ? 'Vừa' :
              getPasswordStrength() === 3 ? 'Mạnh' : 'Tuyệt vời' }}
            </span>
          </div>
          <div class="grid grid-cols-4 gap-1.5 h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all duration-300"
              [class]="getPasswordStrength() >= 1 ? (getPasswordStrength() === 1 ? 'bg-rose-500' : getPasswordStrength() === 2 ? 'bg-amber-500' : getPasswordStrength() === 3 ? 'bg-yellow-500' : 'bg-emerald-500') : 'bg-transparent'">
            </div>
            <div class="h-full rounded-full transition-all duration-300"
              [class]="getPasswordStrength() >= 2 ? (getPasswordStrength() === 2 ? 'bg-amber-500' : getPasswordStrength() === 3 ? 'bg-yellow-500' : 'bg-emerald-500') : 'bg-transparent'">
            </div>
            <div class="h-full rounded-full transition-all duration-300"
              [class]="getPasswordStrength() >= 3 ? (getPasswordStrength() === 3 ? 'bg-yellow-500' : 'bg-emerald-500') : 'bg-transparent'">
            </div>
            <div class="h-full rounded-full transition-all duration-300"
              [class]="getPasswordStrength() >= 4 ? 'bg-emerald-500' : 'bg-transparent'">
            </div>
          </div>
        </div>
      }
    </div>

  </div>

  <!-- Drawer Footer Buttons -->
  <div class="px-6 py-4 border-t border-slate-100 flex items-center justify-end gap-3 bg-white">
    <button type="button" (click)="close.emit()" [disabled]="isSubmitting"
      class="px-6 py-2.5 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-full font-bold text-xs transition-all active:scale-[0.98] cursor-pointer disabled:opacity-50">
      Hủy
    </button>
    <button type="button" (click)="submitCreateUser()" [disabled]="isSubmitting"
      class="px-6 py-2.5 bg-primary hover:bg-emerald-800 disabled:opacity-50 text-white rounded-full font-bold text-xs transition-all active:scale-[0.98] shadow-xs cursor-pointer inline-flex items-center gap-2">
      @if (isSubmitting) {
        <lucide-icon name="loader-2" class="h-4 w-4 animate-spin"></lucide-icon>
        <span>Đang tạo...</span>
      } @else {
        <span>Tạo tài khoản</span>
      }
    </button>
  </div>
</div>
