<div class="confirm" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
  <header class="confirm__head">
    <span class="confirm__icon" [class.is-danger]="data.confirmColor === 'warn'" aria-hidden="true">
      <lucide-icon [name]="data.confirmColor === 'warn' ? 'triangle-alert' : 'circle-help'" />
    </span>
    <h2 id="confirm-title">{{ data.title }}</h2>
  </header>
  <p id="confirm-message" class="confirm__message">{{ data.message }}</p>
  <footer class="confirm__actions">
    <button type="button" class="confirm__cancel" (click)="onCancel()">{{ data.cancelText || 'Hủy' }}</button>
    <button type="button" class="confirm__ok" [class.is-danger]="data.confirmColor === 'warn'" (click)="onConfirm()">
      {{ data.confirmText || 'Xác nhận' }}
    </button>
  </footer>
</div>
