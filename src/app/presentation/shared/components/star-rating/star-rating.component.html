<div class="star-rating-container" [ngClass]="size">
  @for (star of stars; track $index) {
    @if (star === 'full') {
      <lucide-icon name="star" class="star-icon full h-4 w-4 shrink-0 fill-amber-400 text-amber-400 inline-block"></lucide-icon>
    } @else if (star === 'half') {
      <lucide-icon name="star-half" class="star-icon half h-4 w-4 shrink-0 fill-amber-400 text-amber-400 inline-block"></lucide-icon>
    } @else {
      <lucide-icon name="star" class="star-icon empty h-4 w-4 shrink-0 text-slate-300 inline-block"></lucide-icon>
    }
  }
  @if (rating > 0) {
    <span class="rating-value">{{ rating | number:'1.1-1' }}</span>
  }
</div>
