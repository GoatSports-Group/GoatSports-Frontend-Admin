<div class="flex flex-col sm:flex-row justify-between items-center px-6 py-4 border-t border-slate-100 gap-4 bg-slate-50/10 w-full select-none">
  <!-- Left text showing progress -->
  <span class="text-xs font-semibold text-emerald-500">
    {{ getShowingText() }}
  </span>

  <!-- Pagination Controls -->
  <div class="flex items-center gap-1.5">
    <!-- Double Left (First Page) -->
    <button [disabled]="pageIndex === 0" (click)="goToFirst()"
      class="w-8 h-8 rounded-full border border-slate-200 text-slate-700 hover:bg-emerald-50 flex items-center justify-center font-bold text-xs transition-all cursor-pointer disabled:opacity-55 disabled:pointer-events-none active:scale-95">
      <lucide-icon name="chevrons-left" class="h-4 w-4"></lucide-icon>
    </button>

    <!-- Single Left (Prev Page) -->
    <button [disabled]="pageIndex === 0" (click)="goToPrev()"
      class="w-8 h-8 rounded-full border border-slate-200 text-slate-700 hover:bg-emerald-50 flex items-center justify-center font-bold text-xs transition-all cursor-pointer disabled:opacity-55 disabled:pointer-events-none active:scale-95">
      <lucide-icon name="chevron-left" class="h-4 w-4"></lucide-icon>
    </button>

    <!-- Page List -->
    <div class="flex items-center gap-1">
      @for (page of visiblePages; track $index) {
        @if (page === '...') {
          <span class="w-8 h-8 flex items-center justify-center font-bold text-xs text-slate-400">
            ...
          </span>
        } @else {
          <button (click)="goToPage($any(page))"
            [class]="page === pageIndex 
              ? 'w-8 h-8 rounded-full bg-emerald-900 text-white flex items-center justify-center font-bold text-xs transition-all cursor-pointer shadow-xs scale-105' 
              : 'w-8 h-8 rounded-full border border-slate-200 text-slate-700 hover:bg-emerald-50 flex items-center justify-center font-bold text-xs transition-all cursor-pointer active:scale-95'">
            {{ $any(page) + 1 }}
          </button>
        }
      }
    </div>

    <!-- Single Right (Next Page) -->
    <button [disabled]="(pageIndex + 1) >= totalPages" (click)="goToNext()"
      class="w-8 h-8 rounded-full border border-slate-200 text-slate-700 hover:bg-emerald-50 flex items-center justify-center font-bold text-xs transition-all cursor-pointer disabled:opacity-55 disabled:pointer-events-none active:scale-95">
      <lucide-icon name="chevron-right" class="h-4 w-4"></lucide-icon>
    </button>

    <!-- Double Right (Last Page) -->
    <button [disabled]="(pageIndex + 1) >= totalPages" (click)="goToLast()"
      class="w-8 h-8 rounded-full border border-slate-200 text-slate-700 hover:bg-emerald-50 flex items-center justify-center font-bold text-xs transition-all cursor-pointer disabled:opacity-55 disabled:pointer-events-none active:scale-95">
      <lucide-icon name="chevrons-right" class="h-4 w-4"></lucide-icon>
    </button>
  </div>
</div>
