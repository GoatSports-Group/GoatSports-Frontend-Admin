<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Goat Sports Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/images/goat.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Custom reset for assign role dialog to remove browser defaults, padding, and grey/black borders with high specificity */
    body div.cdk-overlay-pane.custom-assign-role-dialog,
    body div.cdk-overlay-pane.custom-assign-role-dialog .mat-mdc-dialog-container,
    body div.cdk-overlay-pane.custom-assign-role-dialog .mat-mdc-dialog-surface,
    body div.cdk-overlay-pane.custom-assign-role-dialog .mdc-dialog__container,
    body div.cdk-overlay-pane.custom-assign-role-dialog .mdc-dialog__surface,
    body div.cdk-overlay-pane.custom-assign-role-dialog .mat-mdc-dialog-surface-content,
    body div.cdk-overlay-pane.custom-assign-role-dialog .mat-dialog-container,
    body div.cdk-overlay-pane.custom-assign-role-dialog .mat-dialog-surface {
      background: transparent !important;
      background-color: transparent !important;
      --mdc-dialog-container-color: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      overflow: visible !important;
      border-radius: 0 !important;
      border: none !important;
    }

    /* Force parent overlays and dialog container content to be overflow visible with high specificity */
    body div.cdk-overlay-pane.custom-assign-role-dialog,
    body div.cdk-overlay-pane.custom-assign-role-dialog .mat-mdc-dialog-content {
      overflow: visible !important;
    }
  </style>
</head>

<body class="bg-[#f8fafc] text-slate-900 font-sports-body antialiased">
  <app-root></app-root>
</body>

</html>
